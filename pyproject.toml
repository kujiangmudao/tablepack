[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-excel"
version = "0.2.1"
description = "TablePack: PDF tables to multi-sheet Excel packages with original table screenshots, QC notes, and agent skill (MinerU)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pdf-excel contributors" }]
keywords = [
  "pdf",
  "excel",
  "table-extraction",
  "mineru",
  "ocr",
  "document-ai",
  "agent-skill",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Office/Business",
]
dependencies = [
  "openpyxl>=3.1.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=4.9.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pdf-excel = "pdf_excel.cli:main"

[project.urls]
Homepage = "https://github.com/kujiangmudao/tablepack"
Issues = "https://github.com/kujiangmudao/tablepack/issues"
MinerU = "https://github.com/opendatalab/MinerU"

[tool.setuptools.packages.find]
include = ["pdf_excel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
