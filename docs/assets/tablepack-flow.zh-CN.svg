<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-label="TablePack 工作流：PDF 表格 → 一条命令 → 可验收的 Excel 交付包">
  <defs>
    <filter id="ds" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0b1220" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" class="g1"/>
      <stop offset="100%" class="g2"/>
    </linearGradient>
  </defs>
  <style>
    .card { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .accent { fill: #f6f8fa; stroke: url(#accentGrad); stroke-width: 2.5; }
    .txt { fill: #1f2328; font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
    .sub { fill: #57606a; font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
    .mono { fill: #1f2328; font-family: ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace; }
    .arrow { stroke: #afb8c1; stroke-width: 2; fill: none; }
    .arrowhead { fill: #afb8c1; }
    .line { stroke: #d0d7de; stroke-width: 1; }
    .ic { stroke: #0969da; fill: none; stroke-width: 2; }
    .g1 { stop-color: #0969da; }
    .g2 { stop-color: #8250df; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .accent { fill: #161b22; }
      .txt { fill: #e6edf3; }
      .sub { fill: #8b949e; }
      .mono { fill: #e6edf3; }
      .arrow { stroke: #6e7681; }
      .arrowhead { fill: #6e7681; }
      .line { stroke: #30363d; }
      .ic { stroke: #4493f8; }
      .g1 { stop-color: #4493f8; }
      .g2 { stop-color: #a371f7; }
    }
  </style>

  <!-- 输入卡 -->
  <rect x="40" y="62" width="170" height="120" rx="12" class="card" filter="url(#ds)"/>
  <rect x="104" y="92" width="42" height="30" rx="4" class="ic"/>
  <line x1="104" y1="102" x2="146" y2="102" class="ic"/>
  <line x1="104" y1="112" x2="146" y2="112" class="ic"/>
  <line x1="125" y1="92" x2="125" y2="122" class="ic"/>
  <text x="125" y="144" text-anchor="middle" font-size="10" letter-spacing="1.5" class="sub">输入</text>
  <text x="125" y="166" text-anchor="middle" font-size="19" font-weight="700" class="txt">PDF 表格</text>

  <!-- 箭头 1 -->
  <line x1="216" y1="122" x2="256" y2="122" class="arrow"/>
  <polygon points="268,122 254,115 254,129" class="arrowhead"/>

  <!-- 中央卡 -->
  <rect x="274" y="40" width="288" height="164" rx="16" class="accent" filter="url(#ds)"/>
  <text x="418" y="112" text-anchor="middle" font-size="28" font-weight="700" class="txt">TablePack</text>
  <line x1="352" y1="130" x2="484" y2="130" class="line"/>
  <text x="418" y="154" text-anchor="middle" font-size="13" class="sub">一条命令，交付可验收</text>
  <text x="418" y="178" text-anchor="middle" font-size="13" class="mono">$ python -m pdf_excel</text>

  <!-- 箭头 2 -->
  <line x1="568" y1="122" x2="608" y2="122" class="arrow"/>
  <polygon points="620,122 606,115 606,129" class="arrowhead"/>

  <!-- 输出卡 -->
  <rect x="626" y="50" width="294" height="144" rx="12" class="card" filter="url(#ds)"/>
  <text x="646" y="86" font-size="10" letter-spacing="1.5" class="sub">OUTPUT</text>
  <text x="646" y="112" font-size="12.5" class="mono sub">output/&lt;文件名&gt;/</text>
  <text x="646" y="134" font-size="12.5" class="mono">├── &lt;文件名&gt;.xlsx</text>
  <text x="646" y="154" font-size="12.5" class="mono">├── 原始表格/</text>
  <text x="646" y="174" font-size="12.5" class="mono">├── 图片/</text>
  <text x="646" y="194" font-size="12.5" class="mono">└── 转换说明.md</text>

  <!-- 底部标语 -->
  <text x="480" y="232" text-anchor="middle" font-size="12" class="sub">不用学 MinerU 命令行 · 不用折腾 JSON · 不用看教程</text>
</svg>
